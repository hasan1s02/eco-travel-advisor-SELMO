# ---------------------------------------------------------------------------
# Alternative NLU pipeline using a DistilBERT transformer via HFTransformersNLP.
#
# NOT the default. Documented and kept runnable because the brief asks for the
# comparison, and because the reasoning for rejecting it is part of the result:
# on the CPU-only free deployment tier this pipeline pushed median inference
# past the three-second response requirement in section 2, for a marginal
# accuracy gain over the spaCy + DIET default.
#
# To evaluate it:
#   rasa train nlu --config config_distilbert.yml --fixed-model-name nlu_distilbert
#   rasa test nlu --config config_distilbert.yml --nlu data/nlu.yml \
#                 --cross-validation --folds 5 --out docs/metrics/nlu-distilbert
#
# Requires: pip install "rasa[transformers]==3.6.21"
# ---------------------------------------------------------------------------
recipe: default.v1
assistant_id: eco_travel_advisor_distilbert
language: en

pipeline:
  - name: LanguageModelFeaturizer
    model_name: "distilbert"
    model_weights: "distilbert-base-uncased"

  - name: WhitespaceTokenizer

  - name: RegexFeaturizer
    case_sensitive: false
    use_word_boundaries: true

  - name: LexicalSyntacticFeaturizer

  - name: CountVectorsFeaturizer

  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  - name: DIETClassifier
    epochs: 140
    constrain_similarities: true
    entity_recognition: true
    intent_classification: true

  - name: EntitySynonymMapper

  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true

  - name: FallbackClassifier
    threshold: 0.60
    ambiguity_threshold: 0.12

policies:
  - name: MemoizationPolicy
    max_history: 5
  - name: RulePolicy
    core_fallback_threshold: 0.40
    core_fallback_action_name: action_two_stage_clarification
    enable_fallback_prediction: true
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 6
    epochs: 100
    constrain_similarities: true
