version: "3.1"

# ===========================================================================
# NLU training data
#
# Intent boundaries are enforced deliberately, because the first evaluation of
# this assistant scored 0.67 accuracy under 5-fold cross-validation and the
# error analysis showed the cause was overlapping intent definitions rather
# than model capacity. The rules now applied:
#
#   plan_trip         must ask for planning/organising/arranging a trip
#   inform            bare values and short value statements only
#   change_preference must contain a change verb AND name a field
#   restart_planning  must ask to start over, not to change one thing
#   stop              must ask to halt the current questioning
#   deny              disagreement or refusal of an offer, never halting
#   goodbye           farewell only, never combined with thanks
#   thanks            gratitude only, never combined with a farewell
#   ask_methodology   about sources, calculation and trustworthiness
#   ask_data_privacy  about personal data handling specifically
#   out_of_scope      clearly outside sustainable travel planning, INCLUDING
#                     keyboard mash and nonsense
#
# That last point is a finding rather than a preference. DIET with
# constrain_similarities produces confidences at or near 1.000 even for pure
# gibberish -- "mmmmm nnnn" was classified as `greet` at 1.000 -- so a
# FallbackClassifier threshold alone never fires and cannot be relied on as the
# error-recovery mechanism. Nonsense is therefore trained explicitly as
# out_of_scope, which routes it to a response that offers a human, and the
# RulePolicy core fallback remains as the second, independent safety net.
# ===========================================================================

