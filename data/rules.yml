version: "3.1"

rules:

# ---------------------------------------------------------------------------
# Social / meta
# ---------------------------------------------------------------------------
- rule: Say hello
  steps:
    - intent: greet
    - action: utter_greet

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Acknowledge thanks
  steps:
    - intent: thanks
    - action: utter_thanks

- rule: Disclose that this is an automated assistant
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

# ---------------------------------------------------------------------------
# Transparency and privacy are answerable at any point in the conversation.
# Section 2 of the brief lists both as non-functional requirements, and an
# anti-greenwashing assistant that cannot explain itself on demand fails that.
# ---------------------------------------------------------------------------
- rule: Explain the methodology on request
  steps:
    - intent: ask_methodology
    - action: action_explain_methodology

- rule: Answer data-protection questions on request
  steps:
    - intent: ask_data_privacy
    - action: action_explain_privacy

- rule: Explain methodology during intake and resume the form
  condition:
    - active_loop: trip_form
  steps:
    - intent: ask_methodology
    - action: action_explain_methodology
    - action: trip_form
    - active_loop: trip_form

- rule: Answer privacy questions during intake and resume the form
  condition:
    - active_loop: trip_form
  steps:
    - intent: ask_data_privacy
    - action: action_explain_privacy
    - action: trip_form
    - active_loop: trip_form

# ---------------------------------------------------------------------------
# Human escalation - must win from anywhere, including mid-form
# ---------------------------------------------------------------------------
- rule: Escalate to a human advisor
  steps:
    - intent: request_human_agent
    - action: action_handover_to_human

- rule: Escalate to a human advisor during intake
  condition:
    - active_loop: trip_form
  steps:
    - intent: request_human_agent
    - action: action_handover_to_human
    - action: action_deactivate_loop
    - active_loop: null

# ---------------------------------------------------------------------------
# Trip intake form
# ---------------------------------------------------------------------------
- rule: Start trip intake
  steps:
    - intent: plan_trip
    - action: trip_form
    - active_loop: trip_form

- rule: Complete trip intake and produce the first recommendations
  condition:
    - active_loop: trip_form
  steps:
    - action: trip_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: utter_intake_complete
    - action: action_resolve_locations
    - action: action_compare_transport
    - action: utter_ask_continue_planning

- rule: Let the traveller out of the intake form
  condition:
    - active_loop: trip_form
  steps:
    - intent: stop
    - action: utter_stop_form
    - action: action_deactivate_loop
    - active_loop: null

- rule: Restart planning from scratch
  steps:
    - intent: restart_planning
    - action: action_reset_planning

# ---------------------------------------------------------------------------
# Error recovery: two-stage clarification before any escalation
# ---------------------------------------------------------------------------
- rule: Clarify when NLU confidence is low
  steps:
    - intent: nlu_fallback
    - action: action_two_stage_clarification

- rule: Handle requests outside the assistant's remit
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope
